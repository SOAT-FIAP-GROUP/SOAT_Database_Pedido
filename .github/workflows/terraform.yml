name: "Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      aws-region:
        type: string
        required: true
      aws-statefile-s3-bucket:
        type: string
        required: true
      aws-statefile-key:
        type: string
        required: true
      aws-lock-dynamodb-table:
        type: string
        required: true
      destroy:
        type: string
        required: false
        default: "false"
    secrets:
      aws-assume-role-arn:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-assume-role-arn }}
          role-session-name: GitHubOIDC
          aws-region: ${{ inputs.aws-region }}

      # Terraform Init
      - name: Terraform Init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" \
            -backend-config="key=${{ inputs.aws-statefile-key }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ inputs.aws-lock-dynamodb-table }}"

      # Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      # Terraform Plan
      - name: Terraform Plan
        if: ${{ inputs.destroy != 'true' }}
        run: terraform -chdir=terraform plan

      # Terraform Apply
      - name: Terraform Apply
        if: ${{ inputs.destroy != 'true' }}
        run: terraform -chdir=terraform apply -auto-approve

      # Terraform Destroy
      - name: Terraform Destroy
        if: ${{ inputs.destroy == 'true' }}
        run: terraform -chdir=terraform destroy -auto-approve
