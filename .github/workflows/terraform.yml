name: "Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      aws-region:
        type: string
        required: true
      aws-statefile-s3-bucket:
        type: string
        required: true
      aws-statefile-key:
        type: string
        required: true
      aws-lock-dynamodb-table:
        type: string
        required: true
      aws-assume-role-arn:
        type: string
        required: true
      destroy:
        type: string
        required: false
        default: 'false'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-assume-role-arn }}
          role-session-name: GitHubOIDC
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" \
            -backend-config="key=${{ inputs.aws-statefile-key }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ inputs.aws-lock-dynamodb-table }}"

      - name: Terraform Validate
        run: terraform validate


      - name: Terraform Plan
        if: ${{ inputs.destroy != 'true' }}
        run: terraform plan


      - name: Terraform Apply
        if: ${{ inputs.destroy != 'true' }}
        run: terraform apply -auto-approve


      - name: Terraform Destroy
        if: ${{ inputs.destroy == 'true' }}
        run: terraform destroy -auto-approve